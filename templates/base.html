<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LOW-LEVEL{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='icon.ico') }}">

    <!-- OG-теги для Discord/Telegram -->
    <meta property="og:title" content="{% block og_title %}LOW-LEVEL{% endblock %}">
    <meta property="og:description" content="{% block og_desc %}Фабричная игра с тепловой механикой{% endblock %}">
    <meta property="og:image" content="{{ url_for('static', filename='preview.png', _external=True) }}">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a href="{{ url_for('index') }}" class="logo">
            <img src="{{ url_for('static', filename='icon.ico') }}" alt="">
            LOW-LEVEL
        </a>
        <nav>
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('changelog') }}">Changelog</a>
            <a href="{{ game.github }}" target="_blank">GitHub</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>© 2026 LOW-LEVEL. Текстуры позаимствованы из Mindustry и Factoriodustry.</p>
    </footer>
</body>
</html>
