<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Payload{% endblock %}</title>

    <link rel="icon" href="{{ url_for('static', filename='icon.ico') }}">

    <meta property="og:title" content="{% block og_title %}LOW-LEVEL{% endblock %}">
    <meta property="og:description" content="{% block og_desc %}A Factory-style game with thermal mechanics.{% endblock %}">
    <meta property="og:image" content="{{ url_for('static', filename='preview.png', _external=True) }}">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a href="{{ url_for('index') }}" class="logo">
            <img src="{{ url_for('static', filename='icon.ico') }}" alt="">
            Payload
        </a>
        <nav>
            <a href="{{ url_for('index') }}">Main</a>
            <a href="{{ url_for('changelog') }}">Changelog</a>
            <a href="{{ game.github }}" target="_blank">GitHub</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>© 2026 Payload. Textures from Mindustry and Factoriodustry</p>
    </footer>
</body>
</html>
